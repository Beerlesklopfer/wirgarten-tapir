# Mirrors docs/wiki to the GitHub wiki of this repository.
# docs/wiki is the only source: pages edited directly in the wiki are
# overwritten by the next run.
name: Mirror docs/wiki to the wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy docs/wiki and push
        run: |
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Mirror docs/wiki from ${GITHUB_SHA::7}"
          git push
