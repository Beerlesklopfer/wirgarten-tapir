name: Run python tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Run Test
        run: docker compose run web make test
      - name: Upload coverage
        uses: actions/upload-artifact@master
        with:
          name: coverage-reports
          path: coverage.xml
  sonarcloud:
    needs: test
    runs-on: ubuntu-latest
    # Forks without a SonarCloud project have no token: the steps are skipped instead of failing
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: SonarCloud token missing, scan skipped
        if: env.SONAR_TOKEN == ''
        run: echo "No SONAR_TOKEN secret in this repository - SonarCloud scan skipped."
      - uses: actions/checkout@v6
        if: env.SONAR_TOKEN != ''
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: Download coverage.xml
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
